<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>Arlodjie — Toko Jam Tangan</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/app-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="banner.css">
  <script defer src="image-file.js"></script>
  <script defer src="photo-storage.js"></script>
  <script defer src="shop-api.js"></script>
  <script defer src="banner.js"></script>
  <script defer src="prototype.js"></script>
  <script defer src="pwa.js"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a href="#beranda" class="wordmark"><img src="lockup.svg" alt="Arlodjie" width="130" height="48"></a>
      <nav class="bottom" aria-label="Navigasi utama" id="nav"></nav>
      <form id="search" role="search"><input type="search" name="q" placeholder="Cari merek atau model" aria-label="Cari merek atau model"><button class="icon-btn" aria-label="Cari" id="search-btn"></button></form>
      <div class="top-actions">
        <a id="account-link" class="header-account" href="#akun">Akun Saya</a>
        <a class="icon-btn" id="favorite-link" href="#favorit" aria-label="Favorit"></a>
        <a class="icon-btn" id="cart-link" href="#keranjang" aria-label="Keranjang"></a>
      </div>
      <div id="admin-actions" hidden><button id="admin-sign-out" class="btn" type="button" data-action="sign-out">Keluar</button></div>
    </div>
  </header>
  <main id="main" tabindex="-1"><p role="status">Memuat Arlodjie…</p></main>
  <footer class="store-footer">
    <div class="store-footer-inner">
      <a href="#tentang" id="footer-about">About Us</a>
      <button type="button" id="install-app" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>
        Instal aplikasi
      </button>
    </div>
  </footer>
  <dialog id="install-help" aria-labelledby="install-help-title" aria-describedby="install-help-copy">
    <h2 id="install-help-title">Instal Arlodjie</h2>
    <p id="install-help-copy"></p>
    <form method="dialog"><button type="submit" class="btn" autofocus>Tutup</button></form>
  </dialog>
  <dialog id="sheet"></dialog>
  <dialog id="checkout-auth" aria-labelledby="checkout-auth-title" aria-describedby="checkout-auth-copy">
    <form method="dialog">
      <button type="submit" class="icon-btn" aria-label="Tutup" id="close-checkout-auth"></button>
    </form>
    <h2 id="checkout-auth-title">Masuk untuk lanjut checkout</h2>
    <p id="checkout-auth-copy">Masuk atau buat akun untuk menyelesaikan pesanan dan melihat statusnya.</p>
    <div class="checkout-auth-actions">
      <a class="btn primary" href="#masuk" autofocus>Masuk</a>
      <a class="btn" href="#daftar">Buat akun</a>
    </div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
